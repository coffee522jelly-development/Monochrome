<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD-MD EDITOR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style id="user-custom-css"></style>
    <script src="https://cdn.jsdelivr.net/npm/markdown-wasm@1.2.0/dist/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="app">
        <header id="toolbar">
            <div class="toolbar-group">
                <button title="太字 (Ctrl+B)" id="btn-bold"><i class="fas fa-bold"></i></button>
                <button title="斜体 (Ctrl+I)" id="btn-italic"><i class="fas fa-italic"></i></button>
                <button title="見出し" id="btn-header"><i class="fas fa-heading"></i></button>
                <button title="リスト" id="btn-list"><i class="fas fa-list-ul"></i></button>
                <button title="リンク" id="btn-link"><i class="fas fa-link"></i></button>
                <button title="引用" id="btn-quote"><i class="fas fa-quote-left"></i></button>
                <button title="コード" id="btn-code"><i class="fas fa-code"></i></button>
            </div>
            <div class="toolbar-group">
                <select id="mermaid-presets">
                    <option value="">MERMAID プリセット...</option>
                    <option value="flowchart">フローチャート</option>
                    <option value="sequence">シーケンス図</option>
                    <option value="gantt">ガントチャート</option>
                    <option value="class">クラス図</option>
                    <option value="state">状態遷移図</option>
                    <option value="er">ER図</option>
                    <option value="pie">パイチャート</option>
                    <option value="journey">ユーザージャーニー</option>
                    <option value="git">Gitグラフ</option>
                    <option value="mindmap">マインドマップ</option>
                    <option value="timeline">タイムライン</option>
                    <option value="quadrant">クアドラントチャート</option>
                </select>
            </div>
            <div class="toolbar-group">
                <select id="md-presets">
                    <option value="">MD プリセット...</option>
                    <optgroup label="リスト">
                        <option value="checklist_3">チェックリスト (3個)</option>
                        <option value="checklist_5">チェックリスト (5個)</option>
                        <option value="bullet_3">箇条書き (3個)</option>
                        <option value="bullet_nested">箇条書き (ネスト)</option>
                    </optgroup>
                    <optgroup label="テーブル">
                        <option value="table_3x3">テーブル (3x3)</option>
                        <option value="table_5x5">テーブル (5x5)</option>
                        <option value="table_header_only">テーブル (ヘッダーのみ)</option>
                    </optgroup>
                    <optgroup label="その他">
                        <option value="hr">水平線 (HR)</option>
                        <option value="math">数式ブロック (LaTeX)</option>
                        <option value="callout_info">注釈 (Info)</option>
                        <option value="callout_warn">注釈 (Warning)</option>
                        <option value="details">折りたたみ (Details)</option>
                    </optgroup>
                </select>
            </div>
            <div class="toolbar-group">
                <button title="目次作成" id="btn-toc"><i class="fas fa-list-ol"></i> TOC</button>
            </div>
            <div class="toolbar-group">
                <button title="THEME" id="btn-theme"><i class="fas fa-adjust"></i></button>
                <button title="CSS" id="btn-settings"><i class="fas fa-code"></i></button>
            </div>
            <div class="toolbar-group" style="margin-left: auto;">
                <button title="PORTABLE EXPORT" id="btn-export-portable"><i class="fas fa-file-export"></i></button>
                <button id="btn-pdf">EXPORT PDF</button>
            </div>
        </header>

        <div id="settings-panel" class="hidden">
            <div class="settings-content">
                <div class="settings-header">
                    <h3>CSS CONFIGURATION</h3>
                    <button id="btn-close-settings">&times;</button>
                </div>
                <div class="settings-body">
                    <div class="settings-group">
                        <label>CSS PRESETS</label>
                        <div class="preset-controls">
                            <select id="css-presets" style="flex: 1;">
                                <option value="default">--- システム標準 ---</option>
                                <option value="sys:technical">TECHNICAL (CAD)</option>
                                <option value="sys:blueprint">BLUEPRINT</option>
                                <option value="sys:paper">PAPER (REPORT)</option>
                                <option disabled>--- ユーザー定義 ---</option>
                            </select>
                            <button id="btn-delete-preset" title="プリセットを削除" style="background: #a00; color: white;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="settings-group" style="margin-top: 10px;">
                        <label>SAVE AS NEW PRESET</label>
                        <div class="preset-controls">
                            <input type="text" id="preset-name" placeholder="プリセット名を入力...">
                            <button id="btn-save-preset" style="background: var(--btn-success-bg); color: white;"><i class="fas fa-save"></i> SAVE</button>
                        </div>
                    </div>
                    <div class="settings-group">
                        <label>CSS EDITOR</label>
                        <textarea id="custom-css-editor" spellcheck="false" placeholder="/* CSSを入力してください */"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <main id="main-container">
            <div id="editor-container">
                <textarea id="editor" spellcheck="false" placeholder="READY >"></textarea>
            </div>
            <div id="preview-container">
                <div id="preview" class="markdown-body"></div>
            </div>
            <aside id="properties-sidebar">
                <div class="sidebar-header">
                    <span>PROPERTIES</span>
                </div>
                <div id="no-selection-msg">NO SELECTION</div>
                <div id="image-properties" class="hidden">
                    <div class="property-group">
                        <label>ALT TEXT</label>
                        <input type="text" id="prop-alt" placeholder="Image alt text">
                    </div>
                    <div class="property-group">
                        <label>WIDTH (<span id="width-val">300</span>px)</label>
                        <input type="range" id="prop-width" min="50" max="1200" step="10">
                    </div>
                    <div class="property-group">
                        <label>ALIGNMENT</label>
                        <div class="prop-toggle-group">
                            <button data-align="left">LEFT</button>
                            <button data-align="center">CENTER</button>
                            <button data-align="right">RIGHT</button>
                        </div>
                    </div>
                    <div class="property-group" style="margin-top: 20px; font-size: 10px; color: #888;">
                        <label>ASSET ID</label>
                        <code id="prop-id"></code>
                    </div>
                </div>
            </aside>
        </main>
        <footer id="status-bar">
            <div class="status-item"><span id="stat-lines">0</span> LINES</div>
            <div class="status-item"><span id="stat-words">0</span> WORDS</div>
            <div class="status-item"><span id="stat-chars">0</span> CHARS</div>
            <div class="status-spacer"></div>
            <div class="status-item" id="save-status">SAVED</div>
            <div class="status-item" id="btn-help" style="cursor:pointer; border-left: 1px solid var(--border-color); padding-left: 10px;" title="ショートカットを表示">
                <i class="fas fa-question-circle"></i> HELP
            </div>
        </footer>
    </div>
    <div id="help-overlay" class="hidden">
        <div class="help-content">
            <div class="help-header">
                <h3>KEYBOARD SHORTCUTS</h3>
                <button id="btn-close-help">&times;</button>
            </div>
            <div class="help-body">
                <div class="help-item"><kbd>Ctrl</kbd> + <kbd>B</kbd> <span>Bold</span></div>
                <div class="help-item"><kbd>Ctrl</kbd> + <kbd>I</kbd> <span>Italic</span></div>
                <div class="help-item"><kbd>Ctrl</kbd> + <kbd>Z</kbd> <span>Undo</span></div>
                <div class="help-item"><kbd>Ctrl</kbd> + <kbd>Y</kbd> / <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Z</kbd> <span>Redo</span></div>
                <div class="help-item"><kbd>Ctrl</kbd> + <kbd>S</kbd> <span>Export PDF</span></div>
                <div class="help-item"><kbd>Tab</kbd> <span>Insert 4 spaces</span></div>
                <div class="help-item"><kbd>Drop MD File</kbd> <span>Import Markdown</span></div>
                <div class="help-item"><kbd>Drop Image</kbd> <span>Import Image</span></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
