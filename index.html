<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD-MD EDITOR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style id="user-custom-css"></style>
    <script src="https://cdn.jsdelivr.net/npm/markdown-wasm@1.2.0/dist/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="app">
        <header id="toolbar">
            <div class="toolbar-group">
                <button title="BOLD" id="btn-bold">B</button>
                <button title="ITALIC" id="btn-italic">I</button>
                <button title="HEADER" id="btn-header">H</button>
                <button title="LIST" id="btn-list">LI</button>
                <button title="LINK" id="btn-link">LN</button>
                <button title="QUOTE" id="btn-quote">QT</button>
                <button title="CODE" id="btn-code">&lt;/&gt;</button>
            </div>
            <div class="toolbar-group">
                <select id="mermaid-presets">
                    <option value="">MERMAID...</option>
                    <option value="flowchart">FLOW</option>
                    <option value="sequence">SEQ</option>
                    <option value="gantt">GANTT</option>
                    <option value="class">CLASS</option>
                    <option value="state">STATE</option>
                    <option value="er">ER</option>
                    <option value="pie">PIE</option>
                </select>
                <button id="btn-insert-mermaid">+</button>
            </div>
            <div class="toolbar-group">
                <button title="THEME" id="btn-theme"><i class="fas fa-adjust"></i></button>
                <button title="CSS" id="btn-settings"><i class="fas fa-code"></i></button>
            </div>
            <div class="toolbar-group" style="margin-left: auto;">
                <button id="btn-pdf">EXPORT PDF</button>
            </div>
        </header>

        <div id="settings-panel" class="hidden">
            <div class="settings-content">
                <div class="settings-header">
                    <h3>CSS CONFIGURATION</h3>
                    <button id="btn-close-settings">&times;</button>
                </div>
                <div class="settings-body">
                    <div class="settings-group">
                        <label>PRESET:</label>
                        <select id="css-presets">
                            <option value="default">DEFAULT (TECHNICAL)</option>
                            <option value="modern">BLUEPRINT</option>
                            <option value="classic">PAPER</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label>CUSTOM CSS:</label>
                        <textarea id="custom-css-editor" spellcheck="false"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <main id="main-container">
            <div id="editor-container">
                <textarea id="editor" spellcheck="false" placeholder="READY >"></textarea>
            </div>
            <div id="preview-container">
                <div id="preview" class="markdown-body"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
