<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD-MD EDITOR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Fira+Code&family=IBM+Plex+Mono&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Lato&family=Lora&family=Merriweather&family=Noto+Sans+JP:wght@400;700&family=Open+Sans&family=PT+Serif&family=Playfair+Display&family=Press+Start+2P&family=Roboto+Mono&family=Roboto:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style id="user-custom-css"></style>
    <script src="https://cdn.jsdelivr.net/npm/markdown-wasm@1.2.0/dist/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="app">
        <header id="toolbar">
            <div class="toolbar-group">
                <button title="太字 (Ctrl+B)" id="btn-bold"><i class="fas fa-bold"></i></button>
                <button title="斜体 (Ctrl+I)" id="btn-italic"><i class="fas fa-italic"></i></button>
                <button title="見出し" id="btn-header"><i class="fas fa-heading"></i></button>
                <button title="リスト" id="btn-list"><i class="fas fa-list-ul"></i></button>
                <button title="リンク" id="btn-link"><i class="fas fa-link"></i></button>
                <button title="引用" id="btn-quote"><i class="fas fa-quote-left"></i></button>
                <button title="コード" id="btn-code"><i class="fas fa-code"></i></button>
            </div>
            <div class="toolbar-group">
                <select id="mermaid-presets">
                    <option value="">Mermaid 図面プリセット...</option>
                    <option value="flowchart">フローチャート</option>
                    <option value="sequence">シーケンス図</option>
                    <option value="gantt">ガントチャート</option>
                    <option value="class">クラス図</option>
                    <option value="state">状態遷移図</option>
                    <option value="er">ER図</option>
                    <option value="pie">パイチャート</option>
                    <option value="journey">ユーザージャーニー</option>
                    <option value="git">Gitグラフ</option>
                    <option value="mindmap">マインドマップ</option>
                    <option value="timeline">タイムライン</option>
                    <option value="quadrant">クアドラントチャート</option>
                </select>
            </div>
            <div class="toolbar-group">
                <select id="md-presets">
                    <option value="">Markdown プリセット...</option>
                    <optgroup label="リスト">
                        <option value="checklist_3">チェックリスト (3個)</option>
                        <option value="checklist_5">チェックリスト (5個)</option>
                        <option value="bullet_3">箇条書き (3個)</option>
                        <option value="bullet_nested">箇条書き (ネスト)</option>
                    </optgroup>
                    <optgroup label="テーブル">
                        <option value="table_3x3">テーブル (3x3)</option>
                        <option value="table_5x5">テーブル (5x5)</option>
                        <option value="table_header_only">テーブル (ヘッダーのみ)</option>
                    </optgroup>
                    <optgroup label="その他">
                        <option value="hr">水平線 (HR)</option>
                        <option value="math">数式ブロック (LaTeX)</option>
                        <option value="callout_info">注釈 (Info)</option>
                        <option value="callout_warn">注釈 (Warning)</option>
                        <option value="details">折りたたみ (Details)</option>
                    </optgroup>
                </select>
            </div>
            <div class="toolbar-group">
                <button title="目次作成" id="btn-toc"><i class="fas fa-list-ol"></i> 目次作成</button>
            </div>
            <div class="toolbar-group">
                <button title="ポータブル書き出し" id="btn-export-portable"><i class="fas fa-file-export"></i> 外部保存</button>
                <button id="btn-pdf" title="Canvas形式でPDF保存 (図の縮尺がズレる場合があります)">PDF (簡易)</button>
                <button id="btn-print" style="background-color: var(--btn-success-bg); color: white;" title="ブラウザの印刷機能を使用して高品質PDFを保存 (推奨)">
                    <i class="fas fa-print"></i> 高品質PDF保存
                </button>
            </div>
            <div class="toolbar-group" style="margin-left: auto;">
                <button title="テーマ切り替え" id="btn-theme"><i class="fas fa-adjust"></i></button>
                <button title="外観・フォント設定" id="btn-settings"><i class="fas fa-cog"></i> 設定</button>
            </div>
        </header>

        <div id="settings-panel" class="hidden">
            <div class="settings-content">
                <div class="settings-header">
                    <h3>外観・フォント設定</h3>
                    <button id="btn-close-settings">&times;</button>
                </div>
                <div class="settings-body">
                    <div class="settings-group">
                        <label>CSS プリセット</label>
                        <div class="preset-controls">
                            <select id="css-presets" style="flex: 1;">
                                <option value="default">--- システム標準 ---</option>
                                <option value="sys:technical">TECHNICAL (CAD)</option>
                                <option value="sys:blueprint">BLUEPRINT</option>
                                <option value="sys:paper">PAPER (REPORT)</option>
                                <option value="sys:minimal">CLEAN MINIMAL</option>
                                <option value="sys:terminal">RETRO TERMINAL</option>
                                <option value="sys:cyberpunk">NEON CYBERPUNK</option>
                                <option value="sys:solarized">SOLARIZED DARK</option>
                                <option value="sys:academia">DARK ACADEMIA</option>
                                <option value="sys:neon">NEON NIGHT</option>
                                <option value="sys:contrast">HIGH CONTRAST</option>
                                <option disabled>--- ユーザー定義 ---</option>
                            </select>
                            <button id="btn-delete-preset" title="プリセットを削除" style="background: #a00; color: white;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="settings-group" style="margin-top: 10px;">
                        <label>新規プリセットとして保存</label>
                        <div class="preset-controls">
                            <input type="text" id="preset-name" placeholder="プリセット名を入力...">
                            <button id="btn-save-preset" style="background: var(--btn-success-bg); color: white;"><i class="fas fa-save"></i> 保存</button>
                        </div>
                    </div>
                    <div class="settings-group">
                        <label>プレビュー用フォント & サイズ</label>
                        <div class="preset-controls">
                            <select id="font-selector" style="flex: 1;">
                            <optgroup label="等幅 (Monospace)">
                                <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
                                <option value="'Fira Code', monospace">Fira Code</option>
                                <option value="'IBM Plex Mono', monospace">IBM Plex Mono</option>
                                <option value="'Roboto Mono', monospace">Roboto Mono</option>
                                <option value="'Space Mono', monospace">Space Mono</option>
                                <option value="'Courier Prime', monospace">Courier Prime</option>
                            </optgroup>
                            <optgroup label="サンセリフ (Sans-Serif)">
                                <option value="'Inter', sans-serif">Inter</option>
                                <option value="'Roboto', sans-serif">Roboto</option>
                                <option value="'Open Sans', sans-serif">Open Sans</option>
                                <option value="'Lato', sans-serif">Lato</option>
                                <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
                            </optgroup>
                            <optgroup label="セリフ (Serif)">
                                <option value="'Lora', serif">Lora</option>
                                <option value="'Merriweather', serif">Merriweather</option>
                                <option value="'PT Serif', serif">PT Serif</option>
                                <option value="'Playfair Display', serif">Playfair Display</option>
                            </optgroup>
                            <optgroup label="特殊 (Display)">
                                <option value="'Press Start 2P', cursive">Press Start 2P (Retro)</option>
                            </optgroup>
                        </select>
                        <input type="number" id="font-size-input" value="14" min="8" max="48" style="width: 60px;">
                        </div>
                    </div>
                    <div class="settings-group">
                        <label>CSS エディター</label>
                        <textarea id="custom-css-editor" spellcheck="false" placeholder="/* CSSを入力してください */"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <main id="main-container">
            <div id="editor-container">
                <textarea id="editor" spellcheck="false" placeholder="入力を待機中..."></textarea>
            </div>
            <div id="preview-container">
                <div id="preview" class="markdown-body"></div>
            </div>
            <aside id="properties-sidebar">
                <div class="sidebar-header">
                    <span>プロパティ</span>
                </div>
                <div id="no-selection-msg">選択されていません</div>
                <div id="image-properties" class="hidden">
                    <div class="property-group">
                        <label>代替テキスト (Alt)</label>
                        <input type="text" id="prop-alt" placeholder="画像の説明...">
                    </div>
                    <div class="property-group">
                        <label>サイズ (<span id="width-val">300</span>px)</label>
                        <input type="range" id="prop-width" min="50" max="1200" step="10">
                    </div>
                    <div class="property-group">
                        <label>配置</label>
                        <div class="prop-toggle-group">
                            <button data-align="left">左寄せ</button>
                            <button data-align="center">中央</button>
                            <button data-align="right">右寄せ</button>
                        </div>
                    </div>
                    <div class="property-group" style="margin-top: 20px; font-size: 10px; color: #888;">
                        <label>アセットID</label>
                        <code id="prop-id"></code>
                    </div>
                </div>
            </aside>
        </main>
        <footer id="status-bar">
            <div class="status-item"><span id="stat-lines">0</span> 行</div>
            <div class="status-item"><span id="stat-words">0</span> 単語</div>
            <div class="status-item"><span id="stat-chars">0</span> 文字</div>
            <div class="status-spacer"></div>
            <div class="status-item" id="save-status">保存済み</div>
            <div class="status-item" id="btn-help" style="cursor:pointer; border-left: 1px solid var(--border-color); padding-left: 10px;" title="ショートカットを表示">
                <i class="fas fa-question-circle"></i> ヘルプ
            </div>
        </footer>
    </div>
    <div id="help-overlay" class="hidden">
        <div class="help-content">
            <div class="help-header">
                <h3>キーボードショートカット</h3>
                <button id="btn-close-help">&times;</button>
            </div>
            <div class="help-body">
                <div class="help-item"><kbd>Ctrl</kbd> + <kbd>B</kbd> <span>太字</span></div>
                <div class="help-item"><kbd>Ctrl</kbd> + <kbd>I</kbd> <span>斜体</span></div>
                <div class="help-item"><kbd>Ctrl</kbd> + <kbd>Z</kbd> <span>元に戻す (Undo)</span></div>
                <div class="help-item"><kbd>Ctrl</kbd> + <kbd>Y</kbd> / <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Z</kbd> <span>やり直し (Redo)</span></div>
                <div class="help-item"><kbd>Ctrl</kbd> + <kbd>S</kbd> <span>PDF保存</span></div>
                <div class="help-item"><kbd>Tab</kbd> <span>4スペース挿入</span></div>
                <div class="help-item"><kbd>MDドロップ</kbd> <span>Markdownインポート</span></div>
                <div class="help-item"><kbd>画像ドロップ</kbd> <span>画像インポート</span></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
